allowBuilds:
  core-js: false
  unrs-resolver: false

autoDedupe: true

autoInstallPeers: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ijlee2-frontend-configs/*"
  - "ember-testem"

overrides:
  ember-cli-htmlbars: ^7.0.1
  testem: "^4.0.0-beta.1" # Due to ember-cli

packages:
  - "configs/**"
  - "docs/**"
  - "packages/ember-intl"
  - "packages/ember-intl-lint"
  - "packages/ember-intl-update"
  - "packages/ember-intl-utils"
  - "packages/ember-intl-v1-compat"
  - "packages/ember-intl-vite"
  - "tests/**"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
